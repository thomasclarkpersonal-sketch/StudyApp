components:
  securitySchemes:
    OwnerSessionCookie: {"type": "apiKey", "in": "cookie", "name": "__Host-study_session", "description": "Signed HttpOnly Secure SameSite=Strict owner session cookie (required in R3 hosted mode; bypassed on 127.0.0.1 in R1-R2)."}
  parameters:
    ModuleIdParam: {"name": "moduleId", "in": "path", "required": true, "schema": {"type": "string", "minLength": 1}}
    CardIdParam: {"name": "cardId", "in": "path", "required": true, "schema": {"type": "string", "pattern": "^[A-Z0-9_]+-W[0-9]{2,3}-C[0-9]{3,}$"}}
    QuestionIdParam: {"name": "questionId", "in": "path", "required": true, "schema": {"type": "string", "pattern": "^[A-Z0-9_]+-W[0-9]{2,3}-Q[0-9]{3,}$"}}
    IdempotencyKeyHeader: {"name": "Idempotency-Key", "in": "header", "required": false, "description": "Client UUID for safe retry of state-changing operations without duplicate logs", "schema": {"type": "string", "format": "uuid"}}
  responses:
    BadRequestError: {"description": "Malformed JSON syntax, invalid query parameter, or missing required field", "content": {"application/problem+json": {"schema": {"$ref": "#/components/schemas/ProblemDetails"}}}}
    UnauthorizedError: {"description": "Missing or expired owner session in R3 hosted mode, or invalid password", "content": {"application/problem+json": {"schema": {"$ref": "#/components/schemas/ProblemDetails"}}}}
    NotFoundError: {"description": "Requested entity ID does not exist", "content": {"application/problem+json": {"schema": {"$ref": "#/components/schemas/ProblemDetails"}}}}
    ConflictError: {"description": "Concurrent import or state conflict", "content": {"application/problem+json": {"schema": {"$ref": "#/components/schemas/ProblemDetails"}}}}
    UnprocessableEntityError: {"description": "Domain business-rule or JSON Schema validation failure with field-level errors", "content": {"application/problem+json": {"schema": {"$ref": "#/components/schemas/ProblemDetails"}}}}
    TooManyRequestsError: {"description": "Rate limit exceeded (login > 5/min/IP) or monthly Claude API spend cap reached (monthlySpendCapMode = block)", "headers": {"Retry-After": {"schema": {"type": "integer"}}}, "content": {"application/problem+json": {"schema": {"$ref": "#/components/schemas/ProblemDetails"}}}}
    BadGatewayError: {"description": "Upstream Anthropic Claude API timeout or error (self-marking fallback offered)", "content": {"application/problem+json": {"schema": {"$ref": "#/components/schemas/ProblemDetails"}}}}
    ServiceUnavailableError: {"description": "SQLite database unavailable or disk full", "content": {"application/problem+json": {"schema": {"$ref": "#/components/schemas/ProblemDetails"}}}}
