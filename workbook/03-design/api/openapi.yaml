      properties: {"moduleId": {"type": "string"}, "cardCount": {"type": "integer"}, "questionCount": {"type": "integer"}, "module": {"$ref": "#/components/schemas/ModuleSummary"}, "lectures": {"type": "array", "items": {"type": "object"}}, "concepts": {"type": "array", "items": {"type": "object"}}, "conceptMastery": {"type": "object"}, "glossary": {"type": "array", "items": {"type": "object"}}}
    ModuleImportPayload:
