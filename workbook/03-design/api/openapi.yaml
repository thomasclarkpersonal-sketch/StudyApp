      properties: {"id": {"type": "string"}, "code": {"type": "string"}, "name": {"type": "string"}, "colour": {"type": "string", "default": "#2563EB"}, "priorityRank": {"type": "integer"}, "isCs": {"type": "boolean"}, "examType": {"type": "string", "enum": ["closed_book", "open_book", "take_home", "no_final", "unknown"]}, "timezone": {"type": "string", "default": "Asia/Hong_Kong"}, "newCardsPerDay": {"type": ["integer", "null"]}, "maxReviewsPerDay": {"type": ["integer", "null"]}, "quizPerDay": {"type": ["integer", "null"]}, "desiredRetention": {"type": ["number", "null"]}, "dueCardsCount": {"type": "integer"}, "newCardsAvailable": {"type": "integer"}, "dueConceptsCount": {"type": "integer"}, "assessmentModeActive": {"type": "boolean"}, "nearestAssessmentDueAt": {"type": ["string", "null"], "format": "date-time"}}
    ModuleDetail:
