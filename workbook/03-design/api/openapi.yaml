openapi: "3.1.0"
info:
  title: "Study App HTTP & SSE API"
  version: "1.0.0"
  summary: "Single-user spaced-repetition flashcards, concept quizzes, planner, and grounded Claude tutor API."
  description: "Catalog entry A34. Serves the Study App SPA/PWA (`packages/web`).\n- In `R1` and `R2` (`APP_MODE=local`), binds to `127.0.0.1:3000` with no login required (`BR-045`).\n- In `R3` (`APP_MODE=hosted`), requires the `__Host-study_session` cookie on all endpoints except `getHealth` and `loginOwner` (`REQ-F-059`, `REQ-N-015`).\n- All error responses use RFC 9457 Problem Details (`application/problem+json`).\n"
servers: [{"url": "http://127.0.0.1:3000", "description": "Local Study App server (R1 and R2)"}, {"url": "https://studyapp.fly.dev", "description": "Hosted Study App server on Fly.io hkg (R3)"}]
security: [{"OwnerSessionCookie": []}]
paths:
  /api/health:
    get:
      operationId: "getHealth"
      summary: "Health and database readiness check"
      security: []
      x-role: "Public / Any"
      x-traces: ["REQ-N-008", "REQ-N-015"]
      responses: {"200": {"description": "Server and SQLite WAL connection healthy", "content": {"application/json": {"schema": {"type": "object", "required": ["status", "db", "authMode", "mode", "dbApplicationId", "version"], "properties": {"status": {"type": "string", "enum": ["ok"]}, "db": {"type": "string", "enum": ["connected"]}, "authMode": {"type": "string", "enum": ["local_bypass", "password_required"]}, "mode": {"type": "string", "enum": ["local", "hosted"]}, "dbApplicationId": {"type": "string", "example": "0x53544459"}, "version": {"type": "string", "example": "1.0.0"}}}}}}, "503": {"$ref": "#/components/responses/ServiceUnavailableError"}}
  /api/auth/login:
    post:
      operationId: "loginOwner"
      summary: "Authenticate owner password in R3 hosted mode (rate-limited <= 5 failures/min/IP)"
      security: []
      x-role: "Unauthenticated Client -> Student"
      x-traces: ["UC-18", "REQ-F-059", "REQ-N-015", "BR-045"]
      requestBody: {"required": true, "content": {"application/json": {"schema": {"type": "object", "additionalProperties": false, "required": ["password"], "properties": {"password": {"type": "string", "minLength": 8, "maxLength": 256}}}}}}
      responses: {"200": {"description": "Authenticated; sets HttpOnly Secure SameSite=Strict session cookie", "headers": {"Set-Cookie": {"schema": {"type": "string"}}}, "content": {"application/json": {"schema": {"type": "object", "required": ["authenticated", "expiresAt"], "properties": {"authenticated": {"type": "boolean", "const": true}, "expiresAt": {"type": "string", "format": "date-time"}}}}}}, "400": {"$ref": "#/components/responses/BadRequestError"}, "401": {"$ref": "#/components/responses/UnauthorizedError"}, "429": {"$ref": "#/components/responses/TooManyRequestsError"}}
  /api/auth/logout:
    post:
      operationId: "logoutOwner"
      summary: "Revoke active owner session in R3 hosted mode"
      x-role: "Student"
      x-traces: ["UC-18", "REQ-F-059", "BR-045"]
      responses: {"204": {"description": "Session revoked and cookie cleared"}, "401": {"$ref": "#/components/responses/UnauthorizedError"}}
  /api/modules:
    get:
      operationId: "listModules"
      summary: "List all modules with due card/concept counts and active assessment mode status"
      x-role: "Student"
      x-traces: ["UC-06", "UC-07", "UC-08", "UC-10", "REQ-F-021", "REQ-F-038", "BR-005", "BR-043"]
      responses: {"200": {"description": "Ordered list of modules", "content": {"application/json": {"schema": {"type": "object", "required": ["items"], "properties": {"items": {"type": "array", "items": {"$ref": "#/components/schemas/ModuleSummary"}}}}}}}, "400": {"$ref": "#/components/responses/BadRequestError"}, "401": {"$ref": "#/components/responses/UnauthorizedError"}}
  /api/modules/{moduleId}:
    get:
      operationId: "getModuleSummary"
      summary: "Get module details, lectures, concept mastery breakdown, and glossary"
      x-role: "Student"
      x-traces: ["UC-08", "UC-15", "UC-17", "REQ-F-005", "REQ-F-053", "REQ-F-058", "BR-043", "BR-044"]
      parameters: [{"$ref": "#/components/parameters/ModuleIdParam"}]
      responses: {"200": {"description": "Module detail payload", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/ModuleDetail"}}}}, "401": {"$ref": "#/components/responses/UnauthorizedError"}, "404": {"$ref": "#/components/responses/NotFoundError"}}
  /api/import/preview:
    post:
      operationId: "previewModuleImport"
      summary: "Validate 6 pipeline export JSON files against A34 schemas and compute DT-02 diff preview"
      x-role: "Student"
      x-traces: ["UC-06", "REQ-F-021", "REQ-N-020", "DT-02", "BR-020", "BR-021", "BR-022", "BR-024"]
      requestBody: {"required": true, "content": {"application/json": {"schema": {"$ref": "#/components/schemas/ModuleImportPayload"}}}}
      responses: {"200": {"description": "Schema validation passed; returns diff counts and item changes without writing to DB", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/ImportPreviewResponse"}}}}, "400": {"$ref": "#/components/responses/BadRequestError"}, "401": {"$ref": "#/components/responses/UnauthorizedError"}, "422": {"$ref": "#/components/responses/UnprocessableEntityError"}}
  /api/import/apply:
    post:
      operationId: "applyModuleImport"
      summary: "Create verified SQLite backup and atomically import validated module JSON files"
      x-role: "Student"
      x-traces: ["UC-06", "REQ-F-021", "REQ-F-022", "REQ-N-011", "REQ-N-020", "DT-02", "BR-021", "BR-022", "BR-023", "BR-024"]
      parameters: [{"$ref": "#/components/parameters/IdempotencyKeyHeader"}]
      requestBody: {"required": true, "content": {"application/json": {"schema": {"$ref": "#/components/schemas/ModuleImportPayload"}}}}
      responses: {"200": {"description": "Import committed atomically after verified pre-import backup", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/ImportBatchRecord"}}}}, "400": {"$ref": "#/components/responses/BadRequestError"}, "401": {"$ref": "#/components/responses/UnauthorizedError"}, "409": {"$ref": "#/components/responses/ConflictError"}, "422": {"$ref": "#/components/responses/UnprocessableEntityError"}}
  /api/review/next:
    get:
      operationId: "getNextReviewCards"
      summary: "Fetch daily due and new flashcard queue for a module or across all modules"
      x-role: "Student"
      x-traces: ["UC-07", "REQ-F-023", "REQ-F-024", "REQ-F-026", "REQ-F-027", "REQ-N-002", "BR-025"]
      parameters: [{"name": "moduleId", "in": "query", "required": false, "schema": {"type": "string"}}, {"name": "conceptId", "in": "query", "required": false, "description": "Optional filter when drilling linked cards after a failed quiz (REQ-F-034, BR-032)", "schema": {"type": "string"}}, {"name": "limit", "in": "query", "required": false, "schema": {"type": "integer", "minimum": 1, "maximum": 200, "default": 50}}]
      responses: {"200": {"description": "Daily flashcard queue and interval previews for ratings 1..4", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/ReviewQueueResponse"}}}}, "400": {"$ref": "#/components/responses/BadRequestError"}, "401": {"$ref": "#/components/responses/UnauthorizedError"}}
  /api/review/{cardId}/rate:
    post:
      operationId: "submitCardRating"
      summary: "Submit FSRS rating (1=Again, 2=Hard, 3=Good, 4=Easy) for a flashcard"
      x-role: "Student"
      x-traces: ["UC-07", "REQ-F-023", "REQ-N-001", "REQ-N-010", "BR-026", "BR-027"]
      parameters: [{"$ref": "#/components/parameters/CardIdParam"}, {"$ref": "#/components/parameters/IdempotencyKeyHeader"}]
      requestBody: {"required": true, "content": {"application/json": {"schema": {"type": "object", "additionalProperties": false, "required": ["rating", "durationMs"], "properties": {"rating": {"type": "integer", "enum": [1, 2, 3, 4]}, "durationMs": {"type": "integer", "minimum": 0, "maximum": 3600000}, "reviewedAt": {"type": "string", "format": "date-time"}}}}}}
      responses: {"200": {"description": "Updated CardState and created CardReviewLog", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/CardRateResponse"}}}}, "400": {"$ref": "#/components/responses/BadRequestError"}, "401": {"$ref": "#/components/responses/UnauthorizedError"}, "404": {"$ref": "#/components/responses/NotFoundError"}}
  /api/cards/{cardId}:
    patch:
      operationId: "updateCardStateOrContent"
      summary: "Edit flashcard front/back/extra or toggle suspended/flagged status"
      x-role: "Student"
      x-traces: ["UC-07", "REQ-F-025"]
      parameters: [{"$ref": "#/components/parameters/CardIdParam"}]
      requestBody: {"required": true, "content": {"application/json": {"schema": {"type": "object", "additionalProperties": false, "minProperties": 1, "properties": {"front": {"type": "string", "minLength": 1, "maxLength": 2000}, "back": {"type": "string", "minLength": 1, "maxLength": 2000}, "extra": {"type": "string", "maxLength": 4000}, "suspended": {"type": "boolean"}, "flagged": {"type": "boolean"}}}}}}
      responses: {"200": {"description": "Updated Card record", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/CardItem"}}}}, "400": {"$ref": "#/components/responses/BadRequestError"}, "401": {"$ref": "#/components/responses/UnauthorizedError"}, "404": {"$ref": "#/components/responses/NotFoundError"}}
  /api/quiz/next:
    get:
      operationId: "getNextQuizQuestions"
      summary: "Select due concepts and optimal unseen/LRS question variants (DT-03)"
      x-role: "Student"
      x-traces: ["UC-08", "UC-15", "REQ-F-028", "REQ-F-029", "REQ-F-030", "REQ-F-031", "REQ-F-053", "REQ-N-002", "DT-03", "BR-028", "BR-029", "BR-030", "BR-043"]
      parameters: [{"name": "moduleId", "in": "query", "required": false, "schema": {"type": "string"}}, {"name": "limit", "in": "query", "required": false, "schema": {"type": "integer", "minimum": 1, "maximum": 50, "default": 10}}]
      responses: {"200": {"description": "Due concept quiz session queue and any topup FeedbackItems logged", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/QuizQueueResponse"}}}}, "400": {"$ref": "#/components/responses/BadRequestError"}, "401": {"$ref": "#/components/responses/UnauthorizedError"}}
  /api/quiz/{questionId}/attempt:
    post:
      operationId: "submitQuizAttempt"
      summary: "Submit an MCQ, self-marked, or Claude-marked quiz attempt and update ConceptState (DT-04)"
      x-role: "Student"
      x-traces: ["UC-08", "UC-12", "UC-18", "REQ-F-032", "REQ-F-033", "REQ-F-034", "REQ-F-043", "REQ-F-047", "REQ-F-048", "REQ-F-061", "REQ-N-004", "REQ-N-010", "DT-04", "BR-026", "BR-031", "BR-032", "BR-041"]
      parameters: [{"$ref": "#/components/parameters/QuestionIdParam"}, {"$ref": "#/components/parameters/IdempotencyKeyHeader"}]
      requestBody: {"required": true, "content": {"application/json": {"schema": {"$ref": "#/components/schemas/QuizAttemptRequest"}}}}
      responses: {"200": {"description": "Graded attempt, updated ConceptState, and linked card_ids if rated Again (1)", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/QuizAttemptResponse"}}}}, "400": {"$ref": "#/components/responses/BadRequestError"}, "401": {"$ref": "#/components/responses/UnauthorizedError"}, "404": {"$ref": "#/components/responses/NotFoundError"}, "422": {"$ref": "#/components/responses/UnprocessableEntityError"}, "502": {"$ref": "#/components/responses/BadGatewayError"}}
  /api/quiz/attempts/{attemptId}:
    patch:
      operationId: "overrideQuizAttemptRating"
      summary: "Override the automatic or Claude-assigned FSRS rating on a QuestionAttempt"
      x-role: "Student"
      x-traces: ["UC-08", "UC-12", "REQ-F-044", "BR-031"]
      parameters: [{"name": "attemptId", "in": "path", "required": true, "schema": {"type": "string"}}]
      requestBody: {"required": true, "content": {"application/json": {"schema": {"type": "object", "additionalProperties": false, "required": ["rating"], "properties": {"rating": {"type": "integer", "enum": [1, 2, 3, 4]}}}}}}
      responses: {"200": {"description": "Attempt rating overridden and ConceptState recomputed", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/QuizAttemptResponse"}}}}, "400": {"$ref": "#/components/responses/BadRequestError"}, "401": {"$ref": "#/components/responses/UnauthorizedError"}, "404": {"$ref": "#/components/responses/NotFoundError"}}
  /api/quiz/offline-sync:
    post:
      operationId: "flushOfflineQuizQueue"
      summary: "Replay offline card ratings, MCQ attempts, and pending_claude written answers on reconnect (R3)"
      x-role: "Student"
      x-traces: ["UC-18", "REQ-F-060", "REQ-F-061", "REQ-N-009"]
      parameters: [{"$ref": "#/components/parameters/IdempotencyKeyHeader"}]
      requestBody: {"required": true, "content": {"application/json": {"schema": {"type": "object", "additionalProperties": false, "required": ["cardRatings", "quizAttempts"], "properties": {"cardRatings": {"type": "array", "maxItems": 500, "items": {"$ref": "#/components/schemas/OfflineCardRatingEvent"}}, "quizAttempts": {"type": "array", "maxItems": 200, "items": {"$ref": "#/components/schemas/OfflineQuizAttemptEvent"}}}}}}}
      responses: {"200": {"description": "All offline events applied and pending_claude answers marked", "content": {"application/json": {"schema": {"type": "object", "required": ["appliedCardRatings", "appliedQuizAttempts", "claudeMarkedCount", "duplicateCount", "results"], "properties": {"appliedCardRatings": {"type": "integer"}, "appliedQuizAttempts": {"type": "integer"}, "claudeMarkedCount": {"type": "integer"}, "duplicateCount": {"type": "integer"}, "results": {"type": "array", "items": {"type": "object"}}}}}}}, "400": {"$ref": "#/components/responses/BadRequestError"}, "401": {"$ref": "#/components/responses/UnauthorizedError"}}
  /api/exams/mock:
    post:
      operationId: "startMockExam"
      summary: "Generate a timed mock exam weighted to the target assessment format (UC-15)"
      x-role: "Student"
      x-traces: ["UC-15", "REQ-F-054", "BR-018", "BR-043"]
      requestBody: {"required": true, "content": {"application/json": {"schema": {"type": "object", "additionalProperties": false, "required": ["moduleId", "durationMinutes", "questionCount"], "properties": {"moduleId": {"type": "string", "minLength": 1}, "deadlineId": {"type": "string"}, "durationMinutes": {"type": "integer", "minimum": 10, "maximum": 300}, "questionCount": {"type": "integer", "minimum": 5, "maximum": 100}}}}}}
      responses: {"201": {"description": "Timed mock exam session created", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/MockExamSession"}}}}, "400": {"$ref": "#/components/responses/BadRequestError"}, "401": {"$ref": "#/components/responses/UnauthorizedError"}, "404": {"$ref": "#/components/responses/NotFoundError"}}
  /api/exams/mock/{examId}/submit:
    post:
      operationId: "submitMockExam"
      summary: "Submit a timed mock exam and receive concept-level marked results report (RPT-03)"
      x-role: "Student"
      x-traces: ["UC-15", "REQ-F-054"]
      parameters: [{"name": "examId", "in": "path", "required": true, "schema": {"type": "string"}}]
      requestBody: {"required": true, "content": {"application/json": {"schema": {"type": "object", "additionalProperties": false, "required": ["answers"], "properties": {"answers": {"type": "array", "items": {"$ref": "#/components/schemas/QuizAttemptRequest"}}}}}}}
      responses: {"200": {"description": "Marked mock exam report (RPT-03)", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/MockExamReport"}}}}, "400": {"$ref": "#/components/responses/BadRequestError"}, "401": {"$ref": "#/components/responses/UnauthorizedError"}, "404": {"$ref": "#/components/responses/NotFoundError"}}
  /api/deadlines:
    get:
      operationId: "listDeadlines"
      summary: "List all deadlines with DT-05 urgency classification, confirmation badge, and milestones"
      x-role: "Student"
      x-traces: ["UC-09", "REQ-F-035", "REQ-F-037", "REQ-N-018", "DT-05", "BR-033", "BR-034"]
      parameters: [{"name": "moduleId", "in": "query", "required": false, "schema": {"type": "string"}}]
      responses: {"200": {"description": "Deadlines sorted by due_at ASC with urgency badges", "content": {"application/json": {"schema": {"type": "object", "required": ["items"], "properties": {"items": {"type": "array", "items": {"$ref": "#/components/schemas/DeadlineItem"}}}}}}}, "400": {"$ref": "#/components/responses/BadRequestError"}, "401": {"$ref": "#/components/responses/UnauthorizedError"}}
  /api/deadlines/{deadlineId}:
    put:
      operationId: "upsertDeadline"
      summary: "Create, edit, confirm, or mark a deadline submitted (sets manually_edited = true, BR-023)"
      x-role: "Student"
      x-traces: ["UC-09", "REQ-F-036", "REQ-F-037", "BR-004", "BR-023", "BR-033", "BR-034"]
      parameters: [{"name": "deadlineId", "in": "path", "required": true, "schema": {"type": "string"}}]
      requestBody: {"required": true, "content": {"application/json": {"schema": {"$ref": "#/components/schemas/DeadlineUpsertRequest"}}}}
      responses: {"200": {"description": "Saved Deadline record with updated urgency", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/DeadlineItem"}}}}, "400": {"$ref": "#/components/responses/BadRequestError"}, "401": {"$ref": "#/components/responses/UnauthorizedError"}, "422": {"$ref": "#/components/responses/UnprocessableEntityError"}}
  /api/deadlines/{deadlineId}/milestones/{milestoneId}:
    put:
      operationId: "upsertMilestone"
      summary: "Create, update, or check off a backward-counted coursework milestone (REQ-F-056)"
      x-role: "Student"
      x-traces: ["UC-16", "REQ-F-056"]
      parameters: [{"name": "deadlineId", "in": "path", "required": true, "schema": {"type": "string"}}, {"name": "milestoneId", "in": "path", "required": true, "schema": {"type": "string"}}]
      requestBody: {"required": true, "content": {"application/json": {"schema": {"$ref": "#/components/schemas/MilestoneUpsertRequest"}}}}
      responses: {"200": {"description": "Saved Milestone record", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/MilestoneItem"}}}}, "400": {"$ref": "#/components/responses/BadRequestError"}, "401": {"$ref": "#/components/responses/UnauthorizedError"}, "404": {"$ref": "#/components/responses/NotFoundError"}}
  /api/readings:
    get:
      operationId: "listReadings"
      summary: "List readings filtered by module or status"
      x-role: "Student"
      x-traces: ["UC-03", "UC-10", "REQ-F-005", "REQ-F-041"]
      parameters: [{"name": "moduleId", "in": "query", "required": false, "schema": {"type": "string"}}, {"name": "status", "in": "query", "required": false, "schema": {"type": "string", "enum": ["unread", "todo", "done", "skimmed", "skipped"]}}]
      responses: {"200": {"description": "Readings list", "content": {"application/json": {"schema": {"type": "object", "required": ["items"], "properties": {"items": {"type": "array", "items": {"$ref": "#/components/schemas/ReadingItem"}}}}}}}, "400": {"$ref": "#/components/responses/BadRequestError"}, "401": {"$ref": "#/components/responses/UnauthorizedError"}}
  /api/readings/{readingId}:
    patch:
      operationId: "updateReadingStatus"
      summary: "Update reading status (unread / todo / done / skimmed / skipped) or due_on date"
      x-role: "Student"
      x-traces: ["UC-10", "REQ-F-041"]
      parameters: [{"name": "readingId", "in": "path", "required": true, "schema": {"type": "string"}}]
      requestBody: {"required": true, "content": {"application/json": {"schema": {"type": "object", "additionalProperties": false, "minProperties": 1, "properties": {"status": {"type": "string", "enum": ["unread", "todo", "done", "skimmed", "skipped"]}, "dueOn": {"type": "string", "format": "date"}, "estMinutes": {"type": "number", "minimum": 1, "maximum": 600}, "confirmed": {"type": "boolean"}}}}}}
      responses: {"200": {"description": "Updated Reading record", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/ReadingItem"}}}}, "400": {"$ref": "#/components/responses/BadRequestError"}, "401": {"$ref": "#/components/responses/UnauthorizedError"}, "404": {"$ref": "#/components/responses/NotFoundError"}}
  /api/tasks/{taskId}:
    put:
      operationId: "upsertTask"
      summary: "Create, edit, or check off a student study task"
      x-role: "Student"
      x-traces: ["UC-10", "REQ-F-038"]
      parameters: [{"name": "taskId", "in": "path", "required": true, "schema": {"type": "string"}}]
      requestBody: {"required": true, "content": {"application/json": {"schema": {"$ref": "#/components/schemas/TaskUpsertRequest"}}}}
      responses: {"200": {"description": "Saved Task record", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/TaskItem"}}}}, "400": {"$ref": "#/components/responses/BadRequestError"}, "401": {"$ref": "#/components/responses/UnauthorizedError"}}
  /api/today:
    get:
      operationId: "getTodayPlan"
      summary: "Generate or fetch Today's 9-step ordered checklist with DT-06 time-budget enforcement (RPT-01)"
      x-role: "Student"
      x-traces: ["UC-10", "UC-16", "REQ-F-038", "REQ-F-039", "REQ-F-040", "REQ-F-041", "REQ-F-053", "REQ-F-055", "REQ-F-056", "REQ-N-003", "DT-06", "BR-035", "BR-036", "BR-037"]
      parameters: [{"name": "date", "in": "query", "required": false, "description": "Optional YYYY-MM-DD local date (defaults to today in Settings.timezone)", "schema": {"type": "string", "format": "date"}}]
      responses: {"200": {"description": "Today DailyPlan and ordered DailyPlanItems", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/TodayPlanResponse"}}}}, "400": {"$ref": "#/components/responses/BadRequestError"}, "401": {"$ref": "#/components/responses/UnauthorizedError"}}
  /api/today/items/{itemId}:
    patch:
      operationId: "updateTodayPlanItem"
      summary: "Mark a Today checklist item completed or manually defer an optional item"
      x-role: "Student"
      x-traces: ["UC-10", "UC-16", "REQ-F-040", "REQ-F-055"]
      parameters: [{"name": "itemId", "in": "path", "required": true, "schema": {"type": "string"}}]
      requestBody: {"required": true, "content": {"application/json": {"schema": {"type": "object", "additionalProperties": false, "minProperties": 1, "properties": {"completed": {"type": "boolean"}, "deferred": {"type": "boolean"}}}}}}
      responses: {"200": {"description": "Updated TodayPlanResponse", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/TodayPlanResponse"}}}}, "400": {"$ref": "#/components/responses/BadRequestError"}, "401": {"$ref": "#/components/responses/UnauthorizedError"}, "404": {"$ref": "#/components/responses/NotFoundError"}}
  /api/feedback/report:
    post:
      operationId: "reportStudyItem"
      summary: "Report a flashcard or quiz question as wrong or unclear (BR-038, SM-3)"
      x-role: "Student"
      x-traces: ["UC-11", "REQ-F-042", "BR-038"]
      requestBody: {"required": true, "content": {"application/json": {"schema": {"type": "object", "additionalProperties": false, "required": ["itemType", "itemId", "reason"], "properties": {"itemType": {"type": "string", "enum": ["card", "question"]}, "itemId": {"type": "string", "minLength": 1}, "reason": {"type": "string", "enum": ["wrong", "unclear"]}, "comment": {"type": "string", "maxLength": 2000, "default": ""}}}}}}
      responses: {"201": {"description": "FeedbackItem recorded and target item flagged", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/FeedbackItemRecord"}}}}, "400": {"$ref": "#/components/responses/BadRequestError"}, "401": {"$ref": "#/components/responses/UnauthorizedError"}, "404": {"$ref": "#/components/responses/NotFoundError"}}
  /api/export/feedback:
    get:
      operationId: "exportFeedbackJson"
      summary: "Export reported items (R1) or full feedback.json (reported, topup, proposed in R3) (RPT-08)"
      x-role: "Student"
      x-traces: ["UC-11", "UC-19", "REQ-F-042", "REQ-F-063", "REQ-N-020"]
      parameters: [{"name": "moduleId", "in": "query", "required": false, "schema": {"type": "string"}}, {"name": "markExported", "in": "query", "required": false, "schema": {"type": "boolean", "default": true}}, {"name": "limit", "in": "query", "required": false, "schema": {"type": "integer", "minimum": 1, "maximum": 1000, "default": 500}}]
      responses: {"200": {"description": "Schema-valid feedback.json payload", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/FeedbackExportBundle"}}}}, "400": {"$ref": "#/components/responses/BadRequestError"}, "401": {"$ref": "#/components/responses/UnauthorizedError"}}
  /api/tutor/threads:
    get:
      operationId: "listTutorThreads"
      summary: "List or search tutor threads for a module (paginated)"
      x-role: "Student"
      x-traces: ["UC-13", "REQ-F-045", "REQ-F-052"]
